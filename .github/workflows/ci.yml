name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:file-limits
      - run: npm run format:check
      - run: npm run test:debt
      - run: npm run test:build-metrics
      - run: npm run debt:check
      - run: npm run lint
      - run: npm run dead-code
      - run: npm run lint:duplicates
      # Coverage, not a bare test run: the thresholds in vite.config.ts are
      # what keep the view layer from drifting back toward 0%.
      - run: npm run test:coverage
      - name: Restore TypeScript build cache
        id: typescript-cache
        uses: actions/cache@v4
        with:
          path: node_modules/.tmp
          key: typescript-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'vite.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            typescript-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build, analyze, and enforce bundle budgets
        env:
          BUILD_BUDGET_MS: 60000
          TYPESCRIPT_CACHE_HIT: ${{ steps.typescript-cache.outputs.cache-hit }}
        run: npm run bundle:check
      - name: Upload build and bundle analysis
        if: ${{ always() && hashFiles('build-metrics/build.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-metrics/build.json
            build-metrics/bundle-report.html
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
