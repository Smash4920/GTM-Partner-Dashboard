# Manual-only on purpose.
#
# GitHub Pages cannot publish from a private repo on a Free plan: the deploy
# step fails with "Failed to create deployment (status: 404)". Previews now
# come from Vercel instead. This workflow is kept so Pages remains one click
# away if the repo goes public or the account moves to Pro; run it from the
# Actions tab after enabling Settings -> Pages -> Source: GitHub Actions.
#
# Pages serves a project site under /<repo>/, which the Vite config handles
# by defaulting the base path to /GTM-Partner-Dashboard/ when VERCEL is unset.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
