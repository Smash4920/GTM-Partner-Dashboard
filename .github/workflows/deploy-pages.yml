# Manual-only on purpose.
#
# GitHub Pages cannot publish from a private repo on a Free plan: the deploy
# step fails with "Failed to create deployment (status: 404)". Previews now
# come from Vercel instead. This workflow is kept so Pages remains one click
# away if the repo goes public or the account moves to Pro; run it from the
# Actions tab after enabling Settings -> Pages -> Source: GitHub Actions.
#
# Deployment is state-changing, so both jobs are guarded to the default
# branch: a manual dispatch from any other ref is skipped. External actions
# are pinned to reviewed commit SHAs (see scripts/check-workflows.mjs).
#
# Pages serves a project site under /<repo>/, which the Vite config handles
# by defaulting the base path to /GTM-Partner-Dashboard/ when VERCEL is unset.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # GitHub Pages publication; allowlisted in scripts/check-workflows.mjs.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
