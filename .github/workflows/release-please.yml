name: Release Please

# Turns conventional commits on main into a release pull request with a
# generated CHANGELOG and a version bump. Merging that pull request tags the
# commit and publishes the GitHub Release. Keep the config and manifest under
# config/ so release automation lives with the other checked-in configuration.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Release publication is state-changing, so the job
# carries the write scopes (allowlisted in scripts/check-workflows.mjs) and
# is guarded to the default branch: a manual dispatch from any other ref is
# skipped.
permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: config/release-please-config.json
          manifest-file: config/release-please-manifest.json
