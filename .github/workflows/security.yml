# Security and governance checks.
#
# ci.yml owns correctness (lint, unit, coverage, e2e, build). This workflow
# owns the security and governance controls documented in docs/security.md:
#
#   secret-scan       gitleaks over the full commit history
#   dependency-audit  npm audit gate, high severity and above
#   dast               OWASP ZAP baseline scan against the production build
#                     served locally by `vite preview`
#   label-taxonomy     strict sync of .github/labels.yml to GitHub
#
# External actions are pinned to reviewed commit SHAs; the trailing comment
# records the reviewed tag and Dependabot's github-actions group proposes
# upgrades weekly. The Renovate stability policy in renovate.json gives npm
# releases an age gate before they are proposed. npm run workflows:check
# enforces the pinning, permission, trigger, timeout, and ZAP rules policy
# locally and in CI.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 06:30 UTC Mondays: re-run on the default branch even when nothing
    # changed, so registry advisories and new detection rules still surface.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # pull-requests: write lets gitleaks comment findings on PRs
      # (GITLEAKS_ENABLE_COMMENTS defaults to true); actions: write lets it
      # upload the SARIF report when it detects a secret. Fork pull requests
      # receive a read-only token, so both scopes are inert for untrusted
      # code.
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Secret scanning must see every commit, not the shallow default.
          fetch-depth: 0
      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts and only required for organization
          # repositories (https://gitleaks.io); see docs/security.md.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the job on high or critical advisories anywhere in the tree.
      # The lockfile is the input, so no build is needed.
      - name: Audit dependency tree
        run: npm audit --audit-level=high

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The ZAP action always attaches its report as a run artifact
      # (artifact_name: zap_scan); the artifact API needs actions: write.
      # The job uses no secrets, and fork pull requests receive a read-only
      # token.
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the production bundle
        run: npm run build
        env:
          # CI has neither VERCEL nor a Pages base path, so serve the app at
          # the server root -- exactly what the ZAP target below expects.
          BASE_PATH: /
      - name: Serve the production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo 'Preview server is serving the build.'
              exit 0
            fi
            sleep 1
          done
          echo 'Preview server did not answer within 60 seconds.' >&2
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4173/'
          # -d prints alert details to the job log. New WARN or FAIL findings
          # fail the run; the only accepted findings are the reviewed,
          # rule-specific entries in .zap/rules.tsv. Blanket WARN suppression
          # (-I) is forbidden and enforced by npm run workflows:check.
          cmd_options: '-d'
          rules_file_name: .zap/rules.tsv
          fail_action: true
          # Reports stay in the run artifact; no auto-filed tracking issue.
          allow_issue_writing: false

  label-taxonomy:
    name: Sync label taxonomy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Label sync rewrites repository state, so it runs only from the default
    # branch, never from a pull request or a dispatch off a feature branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sync .github/labels.yml to GitHub
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6
        with:
          # Strict sync: this file is the single source of truth, so labels
          # that exist on GitHub but not here are deleted.
          skip-delete: false
